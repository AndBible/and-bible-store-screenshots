# Shot manifest. `id` is also the workspace name in the demo backup (demo-content/en/content.yaml).
# Each shot is captured once per target it lists; the number NN in the output file name is the
# shot's position among the shots of that target, in this order.
# action: none | book_chooser | label_dialog | verse_menu | search | workspaces
# (action_arg: verse OSIS ref for verse_menu/label_dialog, query for search)
shots:
  - id: bookmarks-labels        # Jeremiah 9 with colored, labelled bookmarks and notes
    targets: [play-phone, web-phone, play-seven, play-ten, ios-iphone-69, ios-iphone-65, ios-ipad-13]
  - id: formatted-note          # a note with list and emphasis, open on a verse
    action: verse_menu
    action_arg: Jer.9.24
    targets: [play-phone, web-phone, ios-iphone-69, ios-iphone-65]
  - id: label-assign
    action: label_dialog
    action_arg: Jer.9.24
    targets: [play-phone, web-phone, ios-iphone-69, ios-iphone-65]
  - id: crossrefs               # Psalm 33 with cross references
    targets: [play-phone, web-phone, play-ten, ios-iphone-69, ios-iphone-65, ios-ipad-13]
  - id: map                     # a commentary map
    targets: [play-phone, web-phone]
  - id: strongs-parallel        # John 2 KJV with Strong's beside another translation, dictionary in a lower split
    targets: [play-phone, web-phone, play-seven, play-ten, ios-iphone-69, ios-iphone-65, ios-ipad-13, web-desktop, web-mac]
  - id: studypad                # StudyPad "Parable of the Sower"
    targets: [play-phone, web-phone, play-seven, play-ten, ios-iphone-69, ios-iphone-65, ios-ipad-13, web-desktop, web-mac]
  - id: book-chooser
    action: book_chooser
    targets: [play-phone, web-phone, ios-iphone-69, ios-iphone-65, ios-ipad-13]
  - id: rtl-parallel            # Hebrew/Arabic beside English
    targets: [play-seven, play-ten, ios-iphone-69, ios-iphone-65, ios-ipad-13]
  - id: night-split             # split windows in dark mode
    night: true
    targets: [play-seven, play-ten, ios-iphone-69, ios-iphone-65, ios-ipad-13]
  - id: workspaces              # workspace switcher (6.0)
    action: workspaces
    targets: []
  - id: search                  # search results (6.0)
    action: search
    action_arg: love
    targets: [ios-iphone-69, ios-iphone-65, ios-ipad-13]
